name: release-artifacts

on:
  push:
    branches: [pub/tbfix-v6.17, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'When triggered manually against a v* tag, also create or update a GitHub Release.'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gated on the actor because this is a public repo and every step shells out
  # to docker. A push by any other account still creates a run, but every job is
  # skipped and the run reports green with no artifacts -- so a green run here is
  # not by itself proof that the debs were built. Check for the "build deb" job,
  # not just the run's conclusion.
  build:
    name: build deb
    if: ${{ github.actor == 'doctorpangloss' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test reproduction harness supervision
        run: drivers/thunderbolt_frame/tools/tests/tbv-hang-repro-smoke.sh

      - name: Build tbfix DKMS deb
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e TBFIX_LINT=1 \
            ubuntu:24.04 \
            bash tools/ci/distro-package.sh ubuntu
          (cd dist && sha256sum -c thunderbolt-tbfix-dkms_*.deb.sha256)
          bash tools/ci/test-tbfix-package.sh dist/thunderbolt-tbfix-dkms_*.deb
          ls -la dist/

      - name: Verify tbfix DKMS deb builds (noble HWE 6.17 headers)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e TBFIX_VERIFY_DKMS_BUILD=1 \
            ubuntu:24.04 \
            bash tools/ci/distro-install.sh 'dist/thunderbolt-tbfix-dkms_*.deb'

      - name: Build thunderbolt-frame DKMS deb
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e TBFIX_LINT=1 \
            ubuntu:24.04 \
            bash tools/ci/distro-package-frame.sh ubuntu
          (cd dist && sha256sum -c thunderbolt-frame-dkms_*.deb.sha256)
          ls -la dist/

      - name: Verify thunderbolt-frame DKMS deb builds (noble HWE 6.17 headers)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e TBFIX_VERIFY_DKMS_BUILD=1 \
            ubuntu:24.04 \
            bash tools/ci/distro-install-frame.sh \
              'dist/thunderbolt-tbfix-dkms_*.deb' \
              'dist/thunderbolt-frame-dkms_*.deb'

      - name: Build reproduction-tools deb
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e OUT_DIR=/work/dist \
            ubuntu:24.04 \
            bash drivers/thunderbolt_frame/tools/ci/distro-package.sh ubuntu
          ls -la dist/

      - name: Verify reproduction-tools deb
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ubuntu:24.04 \
            bash drivers/thunderbolt_frame/tools/ci/distro-install.sh \
              'dist/thunderbolt-frame-tools_*.deb'

      - name: Build usb4-rdma-provider deb (noble)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e OUT_DIR=/work/dist \
            ubuntu:24.04 \
            bash drivers/thunderbolt_frame/tools/ci/distro-package-rdma.sh ubuntu
          ls -la dist/

      - name: Build usb4-rdma-provider deb (jammy)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e OUT_DIR=/work/dist \
            ubuntu:22.04 \
            bash drivers/thunderbolt_frame/tools/ci/distro-package-rdma.sh ubuntu
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thunderbolt-debs
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: ${{ github.actor == 'doctorpangloss' && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes --latest
          fi
          # Ensure the release is published, not a draft -- a draft is 404 to
          # downstream consumers (the AppMana/apt publish workflow, the DSV4
          # image build), so always force it public.
          gh release edit "$tag" --draft=false --latest
