PACKAGE_NAME="thunderbolt-frame"
# Rides the tbfix version stream: tools/ci/distro-package-frame.sh stamps this
# from dkms/dkms.conf (the one authoritative PACKAGE_VERSION), and the .deb
# depends on thunderbolt-tbfix-dkms (= version). The literal below only covers
# a hand-run `dkms add` straight from the repo.
PACKAGE_VERSION="2.42"

# thunderbolt_frame/thunderbolt_frame_rxe link against the tbfix core, which
# is a vendored 6.17 subsystem (see dkms/dkms.conf). Same kernel gate so
# autoinstall skips foreign kernels instead of failing the package upgrade.
BUILD_EXCLUSIVE_KERNEL="^6[.]17[.]"

# BOTH modules build in the one MAKE pass: the top Makefile builds
# thunderbolt_frame first and feeds its freshly written Module.symvers to
# thunderbolt_frame_rxe (KBUILD_EXTRA_SYMBOLS), because the engine imports
# the tbframe_* exports. Two packages could not guarantee that coupling
# across kernel upgrades.
BUILT_MODULE_NAME[0]="thunderbolt_frame"
BUILT_MODULE_LOCATION[0]="kernel/frame"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="thunderbolt_frame_rxe"
BUILT_MODULE_LOCATION[1]="kernel/rxe"
DEST_MODULE_LOCATION[1]="/updates/dkms"

MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KVER=${kernelver} KDIR=${kernel_source_dir} clean"

# thunderbolt_frame imports private tb_* exports from the tbfix core. Package
# Depends orders the initial install; kernel-update `dkms autoinstall`
# resolves its own graph, and without this edge it may build against the
# in-tree thunderbolt.ko and record incompatible MODVERSIONS CRCs.
BUILD_DEPENDS[0]="thunderbolt-tbfix"
# DKMS >= 3.2 also rebuilds us when the selected tbfix version changes. Older
# DKMS releases understand BUILD_DEPENDS and harmlessly ignore this newer knob.
BUILD_DEPENDS_REBUILD="yes"

AUTOINSTALL="yes"
