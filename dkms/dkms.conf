PACKAGE_NAME="thunderbolt-tbfix"
PACKAGE_VERSION="2.41"

# This source tree is vendored from Linux 7.0 (stable v7.0.12, the Ubuntu
# noble HWE linux-hwe-7.0 base) and intentionally uses 7.0 kernel APIs.
# Retained fallback headers from older kernels must not make a package
# upgrade fail after the supported running kernel has built successfully.
BUILD_EXCLUSIVE_KERNEL="^7[.]0[.]"

# Module names are UNCHANGED (thunderbolt / thunderbolt_net). Our builds install
# to updates/dkms/, which shadows the in-tree kernel/ copies via the depmod
# search order shipped by Ubuntu (/etc/depmod.d/ubuntu.conf: "search updates
# ubuntu built-in") -- proven: with both copies present, depmod records
# updates/dkms/thunderbolt_net.ko in modules.dep, and modprobe/modinfo resolve
# to it. So OUR modules win at runtime by name.
#
# The old boot -22 (stock thunderbolt_net loading against our core) was a STALE
# initramfs: it was built before our module was installed, so it still carried
# the kernel/ copy. REMAKE_INITRD regenerates the initramfs on install/remove;
# initramfs-tools copy_modules_dir extracts module NAMES and resolves each via
# dracut-install -m -> libkmod -> modules.dep (updates/dkms/), so the refreshed
# initramfs carries OUR modules. This makes the distro-net suppression hack
# (tbfix-net-suppress.sh, removed) unnecessary: the stock copies never load.
REMAKE_INITRD="yes"

BUILT_MODULE_NAME[0]="thunderbolt"
BUILT_MODULE_LOCATION[0]="drivers/thunderbolt"
DEST_MODULE_LOCATION[0]="/updates"

BUILT_MODULE_NAME[1]="thunderbolt_net"
BUILT_MODULE_LOCATION[1]="drivers/net/thunderbolt"
DEST_MODULE_LOCATION[1]="/updates"

BUILT_MODULE_NAME[2]="rdma_rxe"
BUILT_MODULE_LOCATION[2]="drivers/infiniband/sw/rxe"
DEST_MODULE_LOCATION[2]="/updates/dkms"

MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make KDIR=${kernel_source_dir} clean"

AUTOINSTALL="yes"
