PACKAGE_NAME="thunderbolt-ibverbs"
PACKAGE_VERSION="0.2.70"

BUILT_MODULE_NAME[0]="thunderbolt_ibverbs"
BUILT_MODULE_LOCATION[0]="kernel"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make KVER=${kernelver}"

# thunderbolt_ibverbs imports private symbols from thunderbolt-tbfix. Package
# dependencies order the initial install, but kernel-update `dkms autoinstall`
# resolves its own graph; without this edge it may build alphabetically against
# the in-tree thunderbolt.ko and record incompatible MODVERSIONS CRCs.
BUILD_DEPENDS[0]="thunderbolt-tbfix"
# DKMS >= 3.2 also rebuilds us when the selected tbfix version changes. Older
# DKMS releases understand BUILD_DEPENDS and harmlessly ignore this newer knob.
BUILD_DEPENDS_REBUILD="yes"

AUTOINSTALL="yes"
